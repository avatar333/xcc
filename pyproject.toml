[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcom-campaign-planner"
version = "0.1.0"
description = "Self-hosted campaign planner for XCOM 2"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "Flask-Login>=0.6,<1", "Flask-Migrate>=4,<5", "Flask-SQLAlchemy>=3.1,<4", "PyYAML>=6,<7", "Werkzeug>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
