{% extends "base.html" %}{% block content %}<h1>Equipment Builds // {{ playthrough.name }}</h1><div class="panel"><form method="post" action="{{ url_for('equipment.create') }}"><input type="hidden" name="playthrough_id" value="{{ playthrough.id }}"><input class="form-control mb-2" name="name" placeholder="Build name" required><select class="form-select mb-2" name="build_type"><option>Weapon</option><option>Armour</option></select><select class="form-select mb-2" name="base_item_id">{% for item in weapons + armour %}<option value="{{ item.id }}">{{ item.name }} — {{ item.content_pack.name }}</option>{% endfor %}</select><input class="form-control mb-2" name="purpose" placeholder="Purpose"><textarea class="form-control mb-2" name="notes" placeholder="Notes"></textarea><button class="btn btn-info">New build</button></form></div>{% for build in builds %}<div class="panel"><h2>{{ build.name }}</h2><p>{{ build.build_type }} · {{ build.base_item.name }} · {{ build.purpose }}</p><form method="post" action="{{ url_for('equipment.clone', build_id=build.id) }}"><button class="btn btn-sm btn-outline-info">Clone</button></form></div>{% endfor %}{% endblock %}
