{% extends "base.html" %}{% block content %}<h1>Avenger // {{ playthrough.name }}</h1><div class="avenger-grid">{% for room in rooms|sort(attribute='row') %}<button class="room-card" data-bs-toggle="modal" data-bs-target="#room{{ room.id }}"><div class="room-state">{{ room.room_state }}</div><strong>{{ room.facility.name if room.facility else 'EMPTY' }}</strong><small>R{{ room.row }} / C{{ room.column }}</small><span class="badge text-bg-info">{{ room.planning_status }}</span></button><div class="modal fade" id="room{{ room.id }}"><div class="modal-dialog modal-lg"><div class="modal-content panel"><form method="post" action="{{ url_for('avenger.update', room_id=room.id) }}"><input type="hidden" name="playthrough_id" value="{{ playthrough.id }}"><h2>Room {{ room.row }}, {{ room.column }}</h2><select class="form-select mb-2" name="room_state">{% for state in ['Alien Debris','Alien Machinery','Exposed Power Coil','Cleared / EMPTY'] %}<option {% if room.room_state == state %}selected{% endif %}>{{ state }}</option>{% endfor %}</select><select class="form-select mb-2" name="facility_id"><option value="">EMPTY</option>{% for facility in facilities %}<option value="{{ facility.id }}" {% if room.facility_id == facility.id %}selected{% endif %}>{{ facility.name }} — {{ facility.content_pack.name }}</option>{% endfor %}</select><select class="form-select mb-2" name="planning_status">{% for status in ['Planned','Building','Built'] %}<option {% if room.planning_status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select><button class="btn btn-info">Save room</button></form></div></div></div>{% endfor %}</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% endblock %}
